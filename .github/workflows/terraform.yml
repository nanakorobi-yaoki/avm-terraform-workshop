# ===========================================================================
# Demo 03 用ワークフロー（GitHub Actions × Terraform）
#
# ★ 重要 ★ GitHub Actions は「リポジトリのルートの .github/workflows/」しか
#   読み込みません。day2/03-cicd/.github/workflows/ に置いたままでは
#   永遠に起動しないため、デモ用にここへ配置しています。
#   （day2/03-cicd/ 側は座学で読むための教材として残してあります）
#
# 対象ディレクトリ: day2/07-parameters（YAML パラメータのデモ構成）
# ===========================================================================
name: "Terraform Plan & Apply"

on:
  push:
    branches: [main]
    paths:
      - "day2/07-parameters/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "day2/07-parameters/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch: # ← セッション中に手動実行したいとき用

permissions: {}

# ---------------------------------------------------------------------------
# ★ state ロック競合を防ぐ直列化
#   cancel-in-progress は必ず false：apply 途中で強制終了すると
#   Azure 上にリソースは作られたのに state に無い「孤児リソース」が発生します。
# ---------------------------------------------------------------------------
concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # ★ CI と手元の Terraform バージョンは必ず揃える ★
  #   1.9.0 だと AVM VNet 0.19.0 の ipam_pools の validation が
  #   `length(null)` で落ちます（古い Terraform は || の短絡評価をしないため）。
  #   「手元では通るのに CI で落ちる」典型例です。
  TF_VERSION: "1.15.8"
  WORKING_DIR: "day2/07-parameters"
  TF_IN_AUTOMATION: "true"
  # ── 07-parameters が要求する変数 ──
  TF_VAR_customer: "contoso"
  TF_VAR_env: "dev"
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_deployment_resource_group_name: ${{ vars.DEPLOYMENT_RESOURCE_GROUP }}
  # ── OIDC 認証（クライアントシークレット不要） ──
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true

jobs:
  # ─────────────────────────────────────
  # Job 1: 静的解析 & セキュリティスキャン（Azure 認証不要）
  # ─────────────────────────────────────
  validate:
    name: "Validate & Lint"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ env.WORKING_DIR }}/requirements.txt

      - name: Parameter Schema Validation
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          pip install -r requirements.txt
          for params in params/*.yaml; do
            python tools/gen_param_sheet.py \
              --params "$params" \
              --schema schema/params.schema.json \
              --validate-only
          done

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # リポジトリ全体を整形チェック（day1 も含めて崩れを検知）
      - name: Terraform Format Check
        run: terraform fmt -check -recursive day1 day2

      - name: Terraform Init (backend なし)
        run: terraform init -backend=false
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.WORKING_DIR }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: v0.64.0

      # 設定はリポジトリルートの .tflint.hcl を明示的に参照
      # （tflint は既定でカレントディレクトリしか見ないため）
      - name: TFLint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkov (Security Scan)
        uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # v12
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform
          soft_fail: false

  # ─────────────────────────────────────
  # Job 2: Plan（Azure OIDC 認証あり）
  # ─────────────────────────────────────
  plan:
    name: "Terraform Plan"
    needs: validate
    runs-on: ubuntu-latest
    environment: plan # ← environment を付けると sub クレームが変わる点に注意
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure Login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="key=workshop/dev.tfstate"
        working-directory: ${{ env.WORKING_DIR }}

      # pipefail が無いと tee 側の終了コードになり、plan 失敗を見逃します
      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set -o pipefail
          terraform plan -no-color -out=tfplan | tee plan_output.txt
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload Plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfplan
          path: |
            ${{ env.WORKING_DIR }}/tfplan
            ${{ env.WORKING_DIR }}/plan_output.txt
          retention-days: 5

      - name: Policy as Code (Conftest)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.62.0/conftest_0.62.0_Linux_x86_64.tar.gz \
            | tar xz -C /tmp conftest
          terraform show -json tfplan > tfplan.json
          /tmp/conftest test tfplan.json --policy "$GITHUB_WORKSPACE/day2/03-cicd/policy"

      # -----------------------------------------------------------------
      # PR に plan 結果をコメント（sticky: 既存コメントを更新）
      #
      # ★ plan 出力をテンプレートに直接埋めないこと：
      #   出力にバッククォートや ${ が含まれると JS の文字列展開が壊れ、
      #   スクリプトインジェクションの経路にもなります。
      #   必ずファイル / env 経由で渡します。
      # -----------------------------------------------------------------
      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          WORKDIR: ${{ env.WORKING_DIR }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';

            let plan = '';
            try {
              plan = fs.readFileSync(`${process.env.WORKDIR}/plan_output.txt`, 'utf8');
            } catch (e) {
              plan = '(plan 出力を読み取れませんでした)';
            }

            // GitHub のコメント上限は 65536 文字
            const MAX = 55000;
            if (plan.length > MAX) {
              plan = plan.slice(0, MAX) + '\n\n... (出力が長いため省略。全文は Actions のログを参照)';
            }

            const body = [
              marker,
              '### Terraform Plan 📋',
              '',
              '<details><summary>plan 結果を展開</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
              '',
              `<sub>Commit \`${context.sha}\` / Actor @${context.actor}</sub>`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

  # ─────────────────────────────────────
  # Job 3: Apply（main への push のみ / 手動承認ゲート）
  # ─────────────────────────────────────
  apply:
    name: "Terraform Apply"
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production # ← 環境保護ルール（手動承認）をここで効かせる
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure Login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="key=workshop/dev.tfstate"
        working-directory: ${{ env.WORKING_DIR }}

      # plan 時の tfplan をそのまま適用する（再 plan しない = 差分混入を防ぐ）
      - name: Download Plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color tfplan
        working-directory: ${{ env.WORKING_DIR }}

      - name: Summary
        run: echo "### ✅ Apply 完了 (\`${{ env.WORKING_DIR }}\`)" >> "$GITHUB_STEP_SUMMARY"
