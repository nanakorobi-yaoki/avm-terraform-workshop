  #   strategy:
  #     fail-fast: false      # 1 つ失敗しても他の案件を止めない
  #     max-parallel: 3       # 同時実行数を制限（API スロットリング対策）
  #     matrix:
  #       include:
  #         - { customer: contoso,  env: dev,        apply: true  }
  #         - { customer: contoso,  env: production, apply: false }
  #         - { customer: fabrikam, env: production, apply: false }
  #   uses: contoso-org/iac-workflows/.github/workflows/reusable-terraform.yml@v1.4.0
  #   with:
  #     working-directory: ./customers/${{ matrix.customer }}
  #     environment: ${{ matrix.env }}
  #     backend-key: ${{ matrix.customer }}/${{ matrix.env }}.tfstate
  #     backend-storage-account: stststerraformstate001
